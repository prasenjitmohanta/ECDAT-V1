name: Build & Package Windows Executable (ECDAT)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib pandas numpy scipy

      - name: Install Qt 6 via install-qt-action v4
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build ECDAT Executable
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt, Portable Python & Engine Runtime
        run: |
          $deployDir = "build/Release/ECDAT_Windows_x64"
          New-Item -ItemType Directory -Force -Path $deployDir
          
          # Copy main executable
          Copy-Item "build/Release/ecdat_app.exe" "$deployDir/"

          # Create internal assets folders
          New-Item -ItemType Directory -Force -Path "$deployDir/models"
          New-Item -ItemType Directory -Force -Path "$deployDir/ml_engine"
          New-Item -ItemType Directory -Force -Path "$deployDir/rules"
          New-Item -ItemType Directory -Force -Path "$deployDir/python"

          # Copy ML Models from all sources
          if (Test-Path "models") {
            Copy-Item "models/*.pkl" "$deployDir/models/" -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "AST-Parser-main 2/models") {
            Copy-Item "AST-Parser-main 2/models/*.pkl" "$deployDir/models/" -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "ciphertext_ml_scanner.pkl") {
            Copy-Item "ciphertext_ml_scanner.pkl" "$deployDir/models/" -Force -ErrorAction SilentlyContinue
          }

          # Copy ML Engine Predict Script from source
          if (Test-Path "AST-Parser-main 2/ml_engine/predict.py") {
            Copy-Item "AST-Parser-main 2/ml_engine/predict.py" "$deployDir/ml_engine/" -Force
          } elseif (Test-Path "ml_engine/predict.py") {
            Copy-Item "ml_engine/predict.py" "$deployDir/ml_engine/" -Force
          }

          # Copy YARA Signatures from source
          if (Test-Path "AST-Parser-main 2/rules/crypto_signatures.yar") {
            Copy-Item "AST-Parser-main 2/rules/crypto_signatures.yar" "$deployDir/rules/" -Force
          } elseif (Test-Path "rules/crypto_signatures.yar") {
            Copy-Item "rules/crypto_signatures.yar" "$deployDir/rules/" -Force
          }

          # Copy requirements
          if (Test-Path "requirements.txt") {
            Copy-Item "requirements.txt" "$deployDir/" -Force
          }

          # Bundle complete Runner Python 3.12 environment directly into application
          $pythonExePath = (Get-Command python).Source
          $pythonRootDir = Split-Path $pythonExePath
          Write-Host "Bundling complete standalone Python from: $pythonRootDir"
          New-Item -ItemType Directory -Force -Path "$deployDir/python"
          Copy-Item -Path "$pythonRootDir/*" -Destination "$deployDir/python/" -Recurse -Force -ErrorAction SilentlyContinue

          # Run windeployqt with all needed modules & compiler runtime
          windeployqt --release --compiler-runtime --charts "$deployDir/ecdat_app.exe"

          # Correctly copy Official Microsoft VC Redistributable CRT DLLs (ONLY msvcp & vcruntime)
          $crtFiles = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Include "msvcp140.dll", "msvcp140_1.dll", "vcruntime140.dll", "vcruntime140_1.dll" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like "*\VC\Redist\MSVC\*" -and $_.DirectoryName -like "*\x64\*" }
          foreach ($file in $crtFiles) {
            Copy-Item $file.FullName "$deployDir/" -Force -ErrorAction SilentlyContinue
          }

          # Create 1-click Windows launcher
          $batLines = @(
            "@echo off",
            "title ECDAT - Enterprise Cryptographic Discovery & Assessment Tool",
            'cd /d "%~dp0"',
            'start "" "%~dp0ecdat_app.exe"'
          )
          Set-Content -Path "$deployDir/Launch_ECDAT.bat" -Value $batLines -Encoding Ascii

      - name: Create Release Zip Package
        run: |
          Compress-Archive -Path "build/Release/ECDAT_Windows_x64/*" -DestinationPath "ECDAT-Windows-x64.zip"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECDAT-Windows-x64
          path: ECDAT-Windows-x64.zip
