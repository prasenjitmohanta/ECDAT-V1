name: Build & Package Windows Executable (ECDAT)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Qt 6 via install-qt-action v4
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build ECDAT Executable
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt Runtime DLLs (windeployqt)
        run: |
          $deployDir = "build/Release/ECDAT_Windows_x64"
          New-Item -ItemType Directory -Force -Path $deployDir
          Copy-Item "build/Release/ecdat_app.exe" "$deployDir/"
          New-Item -ItemType Directory -Force -Path "$deployDir/models"
          New-Item -ItemType Directory -Force -Path "$deployDir/ml_engine"
          New-Item -ItemType Directory -Force -Path "$deployDir/rules"

          if (Test-Path "models/ciphertext_ml_scanner.pkl") {
            Copy-Item "models/ciphertext_ml_scanner.pkl" "$deployDir/models/"
          } elseif (Test-Path "ciphertext_ml_scanner.pkl") {
            Copy-Item "ciphertext_ml_scanner.pkl" "$deployDir/models/"
          }

          if (Test-Path "AST-Parser-main 2/ml_engine/predict.py") {
            Copy-Item "AST-Parser-main 2/ml_engine/predict.py" "$deployDir/ml_engine/"
          }

          if (Test-Path "AST-Parser-main 2/rules/crypto_signatures.yar") {
            Copy-Item "AST-Parser-main 2/rules/crypto_signatures.yar" "$deployDir/rules/"
          }

          Copy-Item "requirements.txt" "$deployDir/"

          # Run windeployqt with compiler-runtime to bundle MSVC and Qt runtime DLLs
          windeployqt --release --compiler-runtime "$deployDir/ecdat_app.exe"

          # Copy MSVC CRT DLLs directly as a guaranteed fallback
          $vcDirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue
          if ($vcDirs.Count -gt 0) {
            $crtDir = $vcDirs[0].DirectoryName
            Copy-Item "$crtDir\*.dll" "$deployDir/" -Force -ErrorAction SilentlyContinue
          }

          # Create 1-click Windows launcher script
          @"
          @echo off
          title ECDAT - Enterprise Cryptographic Discovery & Assessment Tool
          cd /d "%~dp0"
          start "" "%~dp0ecdat_app.exe"
          "@ | Out-File -FilePath "$deployDir/Launch_ECDAT.bat" -Encoding ascii

      - name: Create Release Zip Package
        run: |
          Compress-Archive -Path "build/Release/ECDAT_Windows_x64/*" -DestinationPath "ECDAT-Windows-x64.zip"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECDAT-Windows-x64
          path: ECDAT-Windows-x64.zip
