name: Build & Package Windows Executable (ECDAT)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Qt 6 via aqtinstall
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -m qtcharts qtsvg --outputdir C:\Qt
          echo "Qt6_DIR=C:\Qt\6.7.2\msvc2019_64\lib\cmake\Qt6" >> $env:GITHUB_ENV
          echo "C:\Qt\6.7.2\msvc2019_64\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\Qt\6.7.2\msvc2019_64\lib\cmake\Qt6"

      - name: Build ECDAT Executable
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt Runtime DLLs (windeployqt)
        run: |
          $deployDir = "build/Release/ECDAT_Windows_x64"
          New-Item -ItemType Directory -Force -Path $deployDir
          Copy-Item "build/Release/ecdat_app.exe" "$deployDir/"
          Copy-Item -Recurse "AST-Parser-main 2/models" "$deployDir/models"
          Copy-Item -Recurse "AST-Parser-main 2/rules" "$deployDir/rules"
          
          # Run windeployqt to bundle all required Qt runtime DLLs
          & "C:\Qt\6.7.2\msvc2019_64\bin\windeployqt.exe" --release "$deployDir/ecdat_app.exe"

      - name: Create Release Zip Package
        run: |
          Compress-Archive -Path "build/Release/ECDAT_Windows_x64/*" -DestinationPath "ECDAT-Windows-x64.zip"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECDAT-Windows-x64
          path: ECDAT-Windows-x64.zip
